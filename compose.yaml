services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: mw
      POSTGRES_PASSWORD: mw
      POSTGRES_DB: mandate_wallet
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mw_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mw -d mandate_wallet"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mw:mw@db:5432/mandate_wallet
      TEST_DATABASE_URL: postgres://mw:mw@db:5432/mandate_wallet
      DEMO_MODE: "true"
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-compose-override}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      FORCE_FALLBACK: ${FORCE_FALLBACK:-false}
    ports:
      - "3000:3000"
    command: ["sh", "-c", "npm run db:migrate && npm run db:seed && npm run start"]

volumes:
  mw_pgdata:
